spring.jpa.properties.hibernate.format_sql=true

parking.dataset.url=https://data.buenosaires.gob.ar/dataset/estacionamiento-en-la-via-publica

# Optional: URL del servicio Python/Scikit-learn para predicción
parking.ml.service.url=${PARKING_ML_SERVICE_URL:}
